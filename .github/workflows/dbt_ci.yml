name: dbt CI

on:
  pull_request:   # no paths filter: a required check must always report, or the PR waits forever
  push:
    branches: [main]
    paths: ["dbt/**", "ingest/**", "tests/**", ".github/workflows/dbt_ci.yml"]

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # cancel superseded PR builds, never a main deploy

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pandas==3.*" pyarrow requests databricks-sql-connector databricks-sdk pytest
      - run: python -m pytest -q tests/

  build:
    needs: python-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dbt/footy_wh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "dbt-core==1.12.3" "dbt-databricks==1.12.5" "sqlfluff==4.3.0" "sqlfluff-templater-dbt==4.3.0"   # the versions tested locally
      - name: Write profiles
        run: |
          mkdir -p ~/.dbt
          cp profiles.ci.yml ~/.dbt/profiles.yml
      - run: dbt deps
      - run: sqlfluff lint models/
      - run: dbt build --target ci
      - name: Generate docs
        if: github.event_name == 'push'
        run: |
          dbt docs generate --target ci --static
          cp target/static_index.html target/index.html
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: dbt/footy_wh/target

  deploy-docs:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
