# Used only by GitHub Actions. No secrets: everything comes from environment variables.
footy_wh:
  target: ci
  outputs:
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: footy
      schema: ci
      threads: 4
