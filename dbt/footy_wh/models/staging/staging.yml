version: 2
models:
  - name: stg_matches
    description: >
      One row per match, typed and de-duplicated. The only layer that interprets raw strings:
      types, readable names, de-duplication (latest _loaded_at wins) and the match key.
    columns:
      - name: match_key
        description: "{{ doc('match_key') }}"
        data_tests: [unique, not_null]
      - name: season
        description: "{{ doc('season') }}"
        data_tests: [not_null]
      - name: div_code
        description: "{{ doc('div_code') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['E0', 'E1', 'SP1', 'D1', 'I1', 'F1']
      - name: match_date
        description: "{{ doc('match_date') }}"
        data_tests: [not_null]
      - name: kickoff_time
        description: Local kick-off time as text (HH:MM). Spark SQL has no TIME type; null where the source omits it.
      - name: home_team
        description: Home team name as the source spells it.
        data_tests:
          - not_null
          - not_same_team:
              arguments:
                other_column: away_team
      - name: away_team
        description: Away team name as the source spells it.
        data_tests: [not_null]
      - name: home_goals
        description: Full-time goals by the home team. Plain cast — a non-number here means a broken file and must fail.
        data_tests: [not_null]
      - name: away_goals
        description: Full-time goals by the away team. Plain cast, as home_goals.
        data_tests: [not_null]
      - name: full_time_result
        description: H home win, D draw, A away win.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['H', 'D']
      - name: ht_home_goals
        description: Half-time goals by the home team (try_cast; null if missing).
      - name: ht_away_goals
        description: Half-time goals by the away team (try_cast; null if missing).
      - name: home_shots
        description: Shots by the home team.
      - name: away_shots
        description: Shots by the away team.
      - name: home_shots_on_target
        description: Shots on target by the home team.
      - name: away_shots_on_target
        description: Shots on target by the away team.
      - name: home_corners
        description: Corners won by the home team.
      - name: away_corners
        description: Corners won by the away team.
      - name: home_fouls
        description: Fouls committed by the home team.
      - name: away_fouls
        description: Fouls committed by the away team.
      - name: home_yellows
        description: Yellow cards shown to the home team.
      - name: away_yellows
        description: Yellow cards shown to the away team.
      - name: home_reds
        description: Red cards shown to the home team.
      - name: away_reds
        description: Red cards shown to the away team.
      - name: odds_home
        description: Bet365 decimal odds for a home win.
      - name: odds_draw
        description: Bet365 decimal odds for a draw.
      - name: odds_away
        description: Bet365 decimal odds for an away win.
      - name: referee
        description: Referee name. Published for English divisions only; added on Day 3.6 (schema evolution).
      - name: _loaded_at
        description: "{{ doc('loaded_at') }}"
      - name: _source_file
        description: URL of the CSV this row came from.
